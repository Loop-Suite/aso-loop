name = "MoneyFlow — 가계부 앱 (Apple App Store 예시 스펙)"
store = "apple"
context = """
1인 가구·프리랜서를 타겟으로 한 자동 가계부 앱. 은행·카드 연동 자동 분류가 핵심 기능이고,
경쟁 앱 대비 수동 입력 없이 지출 패턴을 시각화하는 점이 차별점이다.
"""
scoring_source = "가중치는 aso-loop 기본 루브릭(키워드 적합성 0.30 / 전환 카피 0.25 / 현지화 품질 0.15 / 가독성·비스터핑 0.15 / 정책 준수 0.15)을 그대로 사용."

target_keywords = ["가계부", "자동가계부", "지출관리", "예산관리", "카드내역", "소비패턴"]

# 경쟁 앱명·상표명은 프로젝트마다 다르므로 실제 사용 시 이 리스트를 교체할 것.
# 정규식이므로 |로 여러 개를 묶을 수 있다(대소문자 무시로 매칭됨).
banned_terms = ["뱅크샐러드", "토스\\s*가계부", "브로콜리"]

emoji_max = 2

angles = [
  "자동 분류·연동 편의성을 전면에 세운다.",
  "지출 시각화·인사이트 기능을 전면에 세운다.",
  "1인 가구·프리랜서 타겟의 공감 포인트를 전면에 세운다.",
]

# Apple 앱스토어 필드 4종. keywords의 max_chars=100은 App Store Connect 문서 기준
# 글자수이나, 실제로 자수/바이트 중 무엇으로 세는지는 불확실(멀티바이트 문자 환경에서
# 특히 차이가 날 수 있음) — App Store Connect에서 직접 확인 권장. checks.rs가
# 90% 근접 시 [불확실] 경고를 별도로 띄운다.

[[sections]]
id = "title"
title = "Title"
guide = "가장 검색 비중이 높은 필드. 브랜드명 + 핵심기능 키워드 1~2개."
max_chars = 30
min_chars = 15
required = true
keyword_dedup_target = true

[[sections]]
id = "subtitle"
title = "Subtitle"
guide = "title이 못 담은 핵심 기능·베네핏 키워드. title과 겹치지 않게."
max_chars = 30
min_chars = 15
required = true
keyword_dedup_target = true

[[sections]]
id = "keywords"
title = "Keywords"
guide = "쉼표로 구분된 키워드 필드(사용자에게 비노출). title/subtitle에 이미 쓴 단어는 반복하지 말 것(자동 dedup)."
max_chars = 100
required = true
keyword_dedup_target = true

[[sections]]
id = "promo_text"
title = "Promotional Text"
guide = "앱 업데이트 없이 수시 교체 가능한 홍보 문구. 이벤트·시즌성 메시지에 적합."
max_chars = 170
required = false

[[sections]]
id = "description"
title = "Description"
guide = "기능 상세 설명. 첫 3줄(약 170자)이 '더보기' 없이 노출되므로 핵심 가치를 앞에 배치."
max_chars = 4000
min_chars = 800
required = true

[[criteria]]
id = "keyword_relevance"
name = "키워드 적합성"
weight = 30
guide = "target_keywords가 자연스럽게 반영되고, 검색 의도와 실제 기능이 일치하는가"

[[criteria]]
id = "conversion_copy"
name = "전환 카피"
weight = 25
guide = "검색 결과·상세페이지에서 실제로 탭·설치하게 만드는 후킹력과 베네핏 전달력"

[[criteria]]
id = "localization_quality"
name = "현지화 품질"
weight = 15
guide = "번역투 없이 자연스러운 한국어 표현, 타겟 사용자층 어휘에 맞는가"

[[criteria]]
id = "readability_no_stuffing"
name = "가독성·비스터핑"
weight = 15
guide = "키워드를 욱여넣지 않고 읽었을 때 자연스러운가, 문장이 매끄러운가"

[[criteria]]
id = "compliance"
name = "정책 준수"
weight = 15
guide = "상표권·과장광고·가격문구 등 심사 반려 리스크가 없는가(형식적 금지어 검사는 자동 검사가 처리하므로 내용상 리스크 위주로 평가)"
